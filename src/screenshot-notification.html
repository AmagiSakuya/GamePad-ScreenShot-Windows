<!DOCTYPE html>
<html lang="zh-cn"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>截图通知</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    /* 外层：只负责定位 + 进出场动画，本身不缩放 */
    .stage {
      position: fixed;
      left: 18px;
      top: 18px;
      opacity: 0;
      transform: translateX(-60%) scale(0.98);
      animation: fadeInRight 0.4s cubic-bezier(.4,1.7,.6,1) forwards;
    }
    /* 右上角显示：从右侧进入/退出 */
    .stage.pos-right {
      left: auto;
      right: 18px;
      transform: translateX(60%) scale(0.98);
      animation-name: fadeInLeft;
    }
    /* 内层卡片：负责外观，并通过 CSS zoom 做整体等比缩放（小/中/大） */
    .card {
      min-width: 320px;
      max-width: 380px;
      min-height: 80px;
      background: rgba(30, 30, 30, 0.85);
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      color: #fff;
      font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
    }
    /* ---------- 预览位 ----------
       截图：直接显示保存下来的图片
       循环录制：显示从片段里抽的缩略图 + 播放角标；抽不出帧就退回录像图标 */
    .thumb {
      position: relative;
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
    }
    .preview {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background: #222;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      border: 2px solid #444;
      box-sizing: border-box;
    }
    .thumb.no-img .preview { display: none; }
    .video-icon {
      display: none;
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #8b1e2d;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      border: 2px solid #b93a4a;
      box-sizing: border-box;
    }
    .thumb.no-img .video-icon { display: flex; }
    .play-badge {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    .stage.video .play-badge { display: flex; }
    .stage.text .thumb { display: none; }
    .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .desc {
      font-size: 14px;
      color: #bbb;
    }
    @keyframes fadeInRight {
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes fadeInLeft {
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes fadeOutRight {
      to {
        opacity: 0;
        transform: translateX(-60%) scale(0.98);
      }
    }
    @keyframes fadeOutLeft {
      to {
        opacity: 0;
        transform: translateX(60%) scale(0.98);
      }
    }
    .stage.fade-out {
      animation: fadeOutRight 0.3s forwards;
    }
    .stage.pos-right.fade-out {
      animation-name: fadeOutLeft;
    }
  </style>
</head>
<body>
  <div class="stage" id="notification">
    <div class="card" id="zoomer">
      <div class="thumb" id="thumb">
        <img class="preview" id="preview" alt="预览">
        <div class="video-icon" id="video-icon" aria-hidden="true">🎥</div>
        <span class="play-badge" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z" /></svg>
        </span>
      </div>
      <div class="info">
        <div class="title" id="title">截图成功</div>
        <div class="desc" id="desc">已保存到本地</div>
      </div>
    </div>
  </div>
  <script>
    // 支持直接通过 query 传参
    const params = new URLSearchParams(location.search);
    // 预览位：有图就用图，没图（文字通知 / 抽帧失败）就退回录像图标
    const previewSrc = params.get('img');
    if (previewSrc) {
      document.getElementById('preview').src = previewSrc;
    } else {
      document.getElementById('thumb').classList.add('no-img');
    }
    if (params.has('title')) {
      document.getElementById('title').textContent = params.get('title');
    }
    if (params.has('desc')) {
      document.getElementById('desc').textContent = params.get('desc');
    }
    // 通知大小：整体等比缩放（小/中/大），无效或未传时按 1 处理
    const scaleParam = parseFloat(params.get('scale'));
    if (isFinite(scaleParam) && scaleParam > 0) {
      document.getElementById('zoomer').style.zoom = scaleParam;
    }
    if (params.get('type') === 'video' || params.get('type') === 'text') {
      document.getElementById('notification').classList.add(params.get('type'));
    }
    // 通知位置：right 时从右上角进入，left（默认）从左上角进入
    if (params.get('pos') === 'right') {
      document.getElementById('notification').classList.add('pos-right');
    }
    // 5秒后淡出
    setTimeout(() => {
      document.getElementById('notification').classList.add('fade-out');
      setTimeout(() => window.close(), 300);
    }, 5000);
  </script>


</body></html>
