<!DOCTYPE html>
<html lang="zh-cn"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <title>截图通知</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .notification {
      min-width: 320px;
      max-width: 380px;
      min-height: 80px;
      background: rgba(30, 30, 30, 0.85);
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      color: #fff;
      font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
      opacity: 0;
      transform: translateY(40px) scale(0.98);
      animation: fadeInUp 0.4s cubic-bezier(.4,1.7,.6,1) forwards;
    }
    .preview {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #222;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      border: 2px solid #444;
    }
    .video-icon {
      display: none;
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #8b1e2d;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      border: 2px solid #b93a4a;
    }
    .notification.video .preview { display: none; }
    .notification.video .video-icon { display: flex; }
    .notification.text .preview,
    .notification.text .video-icon { display: none; }
    .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .desc {
      font-size: 14px;
      color: #bbb;
    }
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(40px) scale(0.98);
      }
    }
    .fade-out {
      animation: fadeOut 0.3s forwards;
    }
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
      .notification {
        min-width: 320px;
        max-width: 380px;
        min-height: 80px;
        background: rgba(30, 30, 30, 0.85);
        border-radius: 18px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 18px 24px;
        color: #fff;
        font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
        opacity: 0;
        position: fixed;
        left: 18px;
        top: 18px;
        transform: translateX(-60%) scale(0.98);
        animation: fadeInRight 0.4s cubic-bezier(.4,1.7,.6,1) forwards;
      }
      @keyframes fadeInRight {
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      @keyframes fadeOut {
        to {
          opacity: 0;
          transform: translateX(-60%) scale(0.98);
        }
      }
      .fade-out {
        animation: fadeOut 0.3s forwards;
      }
  </style>
</head>
<body>
  <div class="notification" id="notification">
    <img class="preview" id="preview" src="file:///E:/JavaScriptSpace/gamepad-screenshot/src/screenshot-notification.html" alt="截图预览">
    <div class="video-icon" id="video-icon" aria-label="录像">🎥</div>
    <div class="info">
      <div class="title" id="title">截图成功</div>
      <div class="desc" id="desc">已保存到本地</div>
    </div>
  </div>
  <script>
    // 支持直接通过 query 传参
    const params = new URLSearchParams(location.search);
    if (params.has('img')) {
      document.getElementById('preview').src = params.get('img');
    }
    if (params.has('title')) {
      document.getElementById('title').textContent = params.get('title');
    }
    if (params.has('desc')) {
      document.getElementById('desc').textContent = params.get('desc');
    }
    if (params.get('type') === 'video' || params.get('type') === 'text') {
      document.getElementById('notification').classList.add(params.get('type'));
    }
    // 5秒后淡出
    setTimeout(() => {
      document.getElementById('notification').classList.add('fade-out');
      setTimeout(() => window.close(), 300);
    }, 5000);
  </script>


</body></html>
